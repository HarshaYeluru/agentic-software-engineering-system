name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Security scan (bandit)
        run: bandit -q -r agentic_system url_shortener

      - name: Dependency audit (pip-audit)
        run: pip-audit

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test the generated workflow output
        run: python -m agentic_system.cli --clean --requirement "Validate GitHub Actions pipeline" --approve
